version: 2.1

jobs:
  epoll_edge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Open fds
          command: |
            printf 'maxfd=1024\n' > ev.conf
      - run:
          name: Build event loop
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target epoll_edge -j2
      - run:
          name: Drive edge-triggered epoll
          command: LIONSS_LP=1 ./build/epoll_edge --conf ev.conf --conns 512
  zonemapskip:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Build zone map
          command: |
            printf 'min 0 max 99\n' > zone.txt
      - run:
          name: Build pruner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zonemapskip -j2
      - run:
          name: Skip via zone maps
          command: LIONSS_LP=1 ./build/zonemapskip --zones zone.txt --pred gt50
  LsmTier3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Lay out tiers
          command: |
            mkdir -p lsm && : > lsm/tier3.run
      - run:
          name: Build tiered store
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LsmTier3 -j2
      - run:
          name: Merge tier-3 runs
          command: LIONSS_LP=1 ./build/LsmTier3 --dir lsm --tier 3
  falseshare_pad:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set layout
          command: |
            printf 'threads 8\n' > fs.cfg
      - run:
          name: Build concurrency bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target falseshare_pad -j2
      - run:
          name: Measure false sharing
          command: LIONSS_LP=1 ./build/falseshare_pad --conf fs.cfg --pad 64
  tiderun:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load tide table
          command: |
            printf 'cycles 2\n' > tide.cfg
      - run:
          name: Build tidal model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tiderun -j2
      - run:
          name: Simulate tiderun
          command: LIONSS_LP=1 ./build/tiderun --config tide.cfg --hours 24
  tungsten:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Resolve module graph
          command: |
            printf 'modules = 12\n' > project.cfg
      - run:
          name: Build tungsten service
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tungsten -j2
      - run:
          name: Run integration suite
          command: LIONSS_LP=1 ./build/tungsten --config project.cfg --parallel
